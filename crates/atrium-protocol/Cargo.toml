[package]
name = "atrium-protocol"
version = "0.0.0"
description = "Atrium contract types: normalized agent events and the daemon wire format"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"], optional = true }
specta-typescript = { version = "=0.0.13", optional = true }
specta-serde = { version = "=0.0.13", optional = true }
specta-util = { version = "=0.0.13", optional = true }

[features]
ts = [
    "dep:specta",
    "dep:specta-typescript",
    "dep:specta-serde",
    "dep:specta-util",
]

[[example]]
name = "export-ts"
required-features = ["ts"]

[lints]
workspace = true
