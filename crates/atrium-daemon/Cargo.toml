[package]
name = "atrium-daemon"
version = "0.0.0"
description = "atriumd: owns the store, the agent sessions and the approval ledger, and serves them over the socket"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "atriumd"
path = "src/main.rs"

[dependencies]
atrium-protocol.workspace = true
atrium-agents.workspace = true
atrium-core.workspace = true
atrium-host.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
sha2 = "0.10"
libc = "0.2"
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
atrium-client.workspace = true
tempfile = "3"

[lints]
workspace = true
