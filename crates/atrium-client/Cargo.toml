[package]
name = "atrium-client"
version = "0.0.0"
description = "Atrium's app-side daemon client: connection, replay, per-window delivery"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atrium-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rustix = { version = "1", features = ["process"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"], optional = true }

[features]
# TypeScript types for what windows receive (`Delivery`, `Page`), for the
# app's bindings (M1-09a).
ts = ["dep:specta", "atrium-protocol/ts"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
