[workspace]
resolver = "3"
# M1 (docs/contracts/m1.md §2): crates/ are production code; ownership per
# module is in the contract. The M0 spikes under spikes/ are kept as
# reference until the M1 gate but are no longer built: they target the M0
# contract (revision 2), not M1's revision 3.
members = [
    "crates/atrium-protocol",
    "crates/atrium-agents",
    "crates/atrium-core",
    "crates/atrium-host",
    "crates/atrium-client",
    "crates/atrium-daemon",
    "app/src-tauri",
]
# `cargo build|test|clippy` without `--workspace` leave the app out: it needs
# WebKitGTK's development files on Linux. `--workspace` includes it.
default-members = [
    "crates/atrium-protocol",
    "crates/atrium-agents",
    "crates/atrium-core",
    "crates/atrium-host",
    "crates/atrium-client",
    "crates/atrium-daemon",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
atrium-protocol = { path = "crates/atrium-protocol" }
atrium-agents = { path = "crates/atrium-agents" }
atrium-core = { path = "crates/atrium-core" }
atrium-host = { path = "crates/atrium-host" }
atrium-client = { path = "crates/atrium-client" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "net"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

# Optimized like `release`, with debug assertions on: what `atriumd` needs to
# accept a `Dev` client and `ATRIUM_HOME` (contract §4), so the contract §14
# numbers can be measured against a real daemon process
# (`crates/atrium-daemon/examples/perf.rs`).
[profile.perf]
inherits = "release"
debug-assertions = true
