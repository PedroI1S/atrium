[package]
name = "atrium-ui-shell"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false
description = "Atrium M0-06/M0-06b spike: native chrome, layout B, window opacity, pop-out windows"

# Standalone project: not a member of the repository's root workspace.
[workspace]

[lib]
name = "atrium_ui_shell_lib"
crate-type = ["rlib"]

[dependencies]
# macos-private-api is required for a transparent window (vibrancy shows through).
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSWorkspace", "NSAccessibility", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "block2"] }
block2 = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
