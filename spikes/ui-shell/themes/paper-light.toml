[meta]
name = "Paper Day"
appearance = "light"
vibrancy = false

[primitive]
gray-50 = "#fffaf0"
gray-100 = "#f6f0e4"
gray-200 = "#ece4d6"
gray-300 = "#d9cebc"
gray-400 = "#a99b88"
gray-500 = "#807262"
gray-600 = "#6b5d4d"
gray-700 = "#4a3f33"
gray-800 = "#352d24"
gray-900 = "#2a2118"
gray-950 = "#1c150f"
accent-400 = "#c9693f"
accent-500 = "#b4532a"
accent-600 = "#9c4421"
red-500 = "#b3261e"
amber-500 = "#8f5a00"
green-500 = "#3d7a2a"
blue-500 = "#2b6a9a"
space-1 = "4px"
space-2 = "8px"
space-3 = "12px"
space-4 = "18px"
radius-1 = "4px"
radius-2 = "8px"
radius-3 = "14px"
font-ui = '-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif'
font-serif = 'ui-serif, "New York", "Iowan Old Style", Georgia, serif'
font-code = 'ui-monospace, "SF Mono", Menlo, monospace'
text-sm = "12px"
text-md = "13.5px"
text-lg = "16px"
duration-fast = "120ms"
duration-normal = "260ms"

[semantic]
surface-0 = "{gray-200}"
surface-1 = "{gray-100}"
surface-2 = "{gray-50}"
surface-overlay = "#fffaf0"
surface-glass = "rgba(236, 228, 214, 0.94)"
text = "{gray-900}"
text-muted = "{gray-600}"
text-faint = "{gray-400}"
text-on-accent = "#fffaf0"
border = "#ddd2c0"
border-strong = "#c4b6a0"
focus-ring = "{accent-500}"
accent = "{accent-500}"
accent-hover = "{accent-600}"
accent-muted = "rgba(180, 83, 42, 0.12)"
danger = "{red-500}"
warning = "{amber-500}"
success = "{green-500}"
info = "{blue-500}"
code-bg = "#efe7d8"
diff-add = "rgba(61, 122, 42, 0.13)"
diff-del = "rgba(179, 38, 30, 0.11)"
diff-add-text = "#2f6120"
diff-del-text = "#96201a"
ghost-text = "{gray-400}"
state-running = "{info}"
state-needs-you = "{warning}"
state-failed = "{danger}"
state-ready = "{success}"
space-unit = "{space-1}"
radius = "{radius-2}"
font-ui = "{font-ui}"
font-code = "{font-code}"
text-ui = "{text-md}"
text-code = "12.5px"
motion-fast = "{duration-fast}"
motion-normal = "{duration-normal}"

[component]
panel-gap = "0px"
panel-radius = "0px"
glass-blur = "0px"
tab-radius = "8px"
composer-radius = "12px"
chat-font = "{font-serif}"
chat-text-size = "{text-lg}"
chat-line-height = "1.65"
chat-measure = "70ch"
message-padding-y = "10px"
syntax-keyword = "#9c4421"
syntax-string = "#3d6a1f"
syntax-number = "#8f5a00"
syntax-comment = "#8a7c6a"
syntax-function = "#245f8c"
syntax-type = "#8a3a6e"
syntax-variable = "#2a2118"
syntax-property = "#6b5a2e"
syntax-punctuation = "#807262"
