# Direction C: Paper. Warm, editorial: serif conversation text, generous measure, terracotta accent.
[meta]
name = "Paper Night"
appearance = "dark"
vibrancy = false

[primitive]
gray-50 = "#fbf6ee"
gray-100 = "#f1e9de"
gray-200 = "#ddd2c3"
gray-300 = "#bfb2a2"
gray-400 = "#9a8d7e"
gray-500 = "#867a6c"
gray-600 = "#625648"
gray-700 = "#463d33"
gray-800 = "#2b241e"
gray-900 = "#211c17"
gray-950 = "#1a1612"
accent-400 = "#f0996f"
accent-500 = "#e07a4f"
accent-600 = "#c4623a"
red-400 = "#f08080"
amber-400 = "#e8b552"
green-400 = "#8fc77a"
blue-400 = "#7fb2d6"
space-1 = "4px"
space-2 = "8px"
space-3 = "12px"
space-4 = "18px"
radius-1 = "4px"
radius-2 = "8px"
radius-3 = "14px"
font-ui = '-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif'
font-serif = 'ui-serif, "New York", "Iowan Old Style", Georgia, serif'
font-code = 'ui-monospace, "SF Mono", Menlo, monospace'
text-sm = "12px"
text-md = "13.5px"
text-lg = "16px"
duration-fast = "120ms"
duration-normal = "260ms"

[semantic]
surface-0 = "{gray-950}"
surface-1 = "{gray-900}"
surface-2 = "{gray-800}"
surface-overlay = "#2f2720"
surface-glass = "rgba(26, 22, 18, 0.94)"
text = "{gray-100}"
text-muted = "{gray-300}"
text-faint = "{gray-500}"
text-on-accent = "#1a0f08"
border = "#352d25"
border-strong = "#4a4036"
focus-ring = "{accent-400}"
accent = "{accent-500}"
accent-hover = "{accent-400}"
accent-muted = "rgba(224, 122, 79, 0.18)"
danger = "{red-400}"
warning = "{amber-400}"
success = "{green-400}"
info = "{blue-400}"
code-bg = "#17130f"
diff-add = "rgba(143, 199, 122, 0.14)"
diff-del = "rgba(240, 128, 128, 0.14)"
diff-add-text = "#a9d99a"
diff-del-text = "#f5a0a0"
ghost-text = "{gray-500}"
state-running = "{info}"
state-needs-you = "{warning}"
state-failed = "{danger}"
state-ready = "{success}"
space-unit = "{space-1}"
radius = "{radius-2}"
font-ui = "{font-ui}"
font-code = "{font-code}"
text-ui = "{text-md}"
text-code = "12.5px"
motion-fast = "{duration-fast}"
motion-normal = "{duration-normal}"

[component]
panel-gap = "0px"
panel-radius = "0px"
glass-blur = "0px"
tab-radius = "8px"
composer-radius = "12px"
chat-font = "{font-serif}"
chat-text-size = "{text-lg}"
chat-line-height = "1.65"
chat-measure = "70ch"
message-padding-y = "10px"
syntax-keyword = "#e07a4f"
syntax-string = "#a9c97a"
syntax-number = "#e8b552"
syntax-comment = "#867a6c"
syntax-function = "#7fb2d6"
syntax-type = "#d9a0c0"
syntax-variable = "#f1e9de"
syntax-property = "#c9b48a"
syntax-punctuation = "#9a8d7e"
