[meta]
name = "Glass Light"
appearance = "light"
vibrancy = true

[primitive]
gray-50 = "#f8f9fd"
gray-100 = "#eceef8"
gray-200 = "#dcdff0"
gray-300 = "#bcc1db"
gray-400 = "#8f95b4"
gray-500 = "#676d8c"
gray-600 = "#4a4f69"
gray-700 = "#363a52"
gray-800 = "#262a3e"
gray-900 = "#181b2b"
gray-950 = "#0f1120"
accent-400 = "#6f7df0"
accent-500 = "#5565e8"
accent-600 = "#4452d6"
red-500 = "#c8283d"
amber-500 = "#a85d00"
green-500 = "#16825a"
blue-500 = "#1f6fc4"
space-1 = "4px"
space-2 = "8px"
space-3 = "12px"
space-4 = "16px"
radius-1 = "6px"
radius-2 = "12px"
radius-3 = "18px"
font-ui = '-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif'
font-code = 'ui-monospace, "SF Mono", Menlo, monospace'
text-sm = "12px"
text-md = "13.5px"
text-lg = "15px"
duration-fast = "100ms"
duration-normal = "220ms"

[semantic]
surface-0 = "{gray-100}"
surface-1 = "{gray-50}"
surface-2 = "#ffffff"
surface-overlay = "rgba(255, 255, 255, 0.84)"
surface-glass = "rgba(244, 245, 252, 0.55)"
text = "{gray-900}"
text-muted = "{gray-600}"
text-faint = "{gray-400}"
text-on-accent = "#ffffff"
border = "rgba(24, 27, 43, 0.10)"
border-strong = "rgba(24, 27, 43, 0.20)"
focus-ring = "{accent-500}"
accent = "{accent-600}"
accent-hover = "{accent-500}"
accent-muted = "rgba(68, 82, 214, 0.12)"
danger = "{red-500}"
warning = "{amber-500}"
success = "{green-500}"
info = "{blue-500}"
code-bg = "#eef0fa"
diff-add = "rgba(22, 130, 90, 0.12)"
diff-del = "rgba(200, 40, 61, 0.11)"
diff-add-text = "#0f6a48"
diff-del-text = "#a8182c"
ghost-text = "{gray-400}"
state-running = "{info}"
state-needs-you = "{warning}"
state-failed = "{danger}"
state-ready = "{success}"
space-unit = "{space-1}"
radius = "{radius-2}"
font-ui = "{font-ui}"
font-code = "{font-code}"
text-ui = "{text-md}"
text-code = "12.5px"
motion-fast = "{duration-fast}"
motion-normal = "{duration-normal}"

[component]
panel-gap = "6px"
panel-radius = "{radius}"
glass-blur = "30px"
tab-radius = "10px"
composer-radius = "16px"
syntax-keyword = "#6a3fd0"
syntax-string = "#17724f"
syntax-number = "#b4540e"
syntax-comment = "#7a80a0"
syntax-function = "#2457c5"
syntax-type = "#0f7288"
syntax-variable = "#181b2b"
syntax-property = "#3b4fb8"
syntax-punctuation = "#676d8c"
