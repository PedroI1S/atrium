# Direction B: Flat. Opaque, dense, hairline grid, no blur, mono-flavoured labels, emerald accent.
[meta]
name = "Flat Dark"
appearance = "dark"
vibrancy = false

[primitive]
gray-50 = "#f4f4f5"
gray-100 = "#ededee"
gray-200 = "#d4d4d8"
gray-300 = "#a1a1a6"
gray-400 = "#85858b"
gray-500 = "#6e6e74"
gray-600 = "#4b4b51"
gray-700 = "#3a3a40"
gray-800 = "#26262a"
gray-900 = "#1c1c1f"
gray-950 = "#131315"
gray-1000 = "#0c0c0d"
accent-400 = "#5eead4"
accent-500 = "#34d399"
accent-600 = "#10b981"
red-400 = "#f87171"
amber-400 = "#fbbf24"
green-400 = "#4ade80"
blue-400 = "#60a5fa"
space-1 = "3px"
space-2 = "6px"
space-3 = "9px"
space-4 = "12px"
radius-1 = "2px"
radius-2 = "4px"
radius-3 = "6px"
font-ui = '-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif'
font-code = 'ui-monospace, "SF Mono", Menlo, monospace'
text-sm = "11px"
text-md = "12.5px"
text-lg = "14px"
duration-fast = "60ms"
duration-normal = "120ms"

[semantic]
surface-0 = "{gray-1000}"
surface-1 = "{gray-950}"
surface-2 = "{gray-900}"
surface-overlay = "{gray-900}"
surface-glass = "rgba(12, 12, 13, 0.96)"
text = "{gray-100}"
text-muted = "{gray-300}"
text-faint = "{gray-500}"
text-on-accent = "#04140d"
border = "{gray-800}"
border-strong = "{gray-700}"
focus-ring = "{accent-500}"
accent = "{accent-500}"
accent-hover = "{accent-400}"
accent-muted = "rgba(52, 211, 153, 0.16)"
danger = "{red-400}"
warning = "{amber-400}"
success = "{green-400}"
info = "{blue-400}"
code-bg = "#0f0f11"
diff-add = "rgba(74, 222, 128, 0.13)"
diff-del = "rgba(248, 113, 113, 0.13)"
diff-add-text = "#86efac"
diff-del-text = "#fca5a5"
ghost-text = "{gray-500}"
state-running = "{info}"
state-needs-you = "{warning}"
state-failed = "{danger}"
state-ready = "{success}"
space-unit = "{space-1}"
radius = "{radius-2}"
font-ui = "{font-ui}"
font-code = "{font-code}"
text-ui = "{text-md}"
text-code = "12px"
motion-fast = "{duration-fast}"
motion-normal = "{duration-normal}"

[component]
panel-gap = "0px"
panel-radius = "0px"
glass-blur = "0px"
tab-radius = "0px"
tab-height = "34px"
composer-radius = "4px"
badge-font = "{font-code}"
label-font = "{font-code}"
label-transform = "uppercase"
message-padding-y = "4px"
syntax-keyword = "#7dd3fc"
syntax-string = "#86efac"
syntax-number = "#fcd34d"
syntax-comment = "#6e6e74"
syntax-function = "#5eead4"
syntax-type = "#fda4af"
syntax-variable = "#ededee"
syntax-property = "#c4b5fd"
syntax-punctuation = "#85858b"
