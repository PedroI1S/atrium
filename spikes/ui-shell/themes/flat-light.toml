[meta]
name = "Flat Light"
appearance = "light"
vibrancy = false

[primitive]
gray-50 = "#fafafa"
gray-100 = "#f4f4f5"
gray-200 = "#e7e7ea"
gray-300 = "#d4d4d8"
gray-400 = "#9a9aa1"
gray-500 = "#6e6e76"
gray-600 = "#55555c"
gray-700 = "#3a3a40"
gray-800 = "#26262a"
gray-900 = "#1c1c1f"
gray-950 = "#131315"
accent-400 = "#10b981"
accent-500 = "#0d9468"
accent-600 = "#0b7d56"
red-500 = "#c42b2b"
amber-500 = "#9a5b00"
green-500 = "#17803d"
blue-500 = "#1d65c4"
space-1 = "3px"
space-2 = "6px"
space-3 = "9px"
space-4 = "12px"
radius-1 = "2px"
radius-2 = "4px"
radius-3 = "6px"
font-ui = '-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif'
font-code = 'ui-monospace, "SF Mono", Menlo, monospace'
text-sm = "11px"
text-md = "12.5px"
text-lg = "14px"
duration-fast = "60ms"
duration-normal = "120ms"

[semantic]
surface-0 = "{gray-200}"
surface-1 = "{gray-50}"
surface-2 = "#ffffff"
surface-overlay = "#ffffff"
surface-glass = "rgba(231, 231, 234, 0.96)"
text = "{gray-950}"
text-muted = "{gray-600}"
text-faint = "{gray-400}"
text-on-accent = "#ffffff"
border = "#d9d9de"
border-strong = "#bdbdc4"
focus-ring = "{accent-500}"
accent = "{accent-600}"
accent-hover = "{accent-500}"
accent-muted = "rgba(11, 125, 86, 0.12)"
danger = "{red-500}"
warning = "{amber-500}"
success = "{green-500}"
info = "{blue-500}"
code-bg = "#f1f1f3"
diff-add = "rgba(23, 128, 61, 0.12)"
diff-del = "rgba(196, 43, 43, 0.11)"
diff-add-text = "#116530"
diff-del-text = "#a31f1f"
ghost-text = "{gray-400}"
state-running = "{info}"
state-needs-you = "{warning}"
state-failed = "{danger}"
state-ready = "{success}"
space-unit = "{space-1}"
radius = "{radius-2}"
font-ui = "{font-ui}"
font-code = "{font-code}"
text-ui = "{text-md}"
text-code = "12px"
motion-fast = "{duration-fast}"
motion-normal = "{duration-normal}"

[component]
panel-gap = "0px"
panel-radius = "0px"
glass-blur = "0px"
tab-radius = "0px"
tab-height = "34px"
composer-radius = "4px"
badge-font = "{font-code}"
label-font = "{font-code}"
label-transform = "uppercase"
message-padding-y = "4px"
syntax-keyword = "#0b6a9e"
syntax-string = "#14703a"
syntax-number = "#9a5b00"
syntax-comment = "#7c7c84"
syntax-function = "#0b7d56"
syntax-type = "#b4233d"
syntax-variable = "#131315"
syntax-property = "#6a3fb5"
syntax-punctuation = "#6e6e76"
