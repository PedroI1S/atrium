# Direction A: Glass. Translucent chrome over native vibrancy, floating rounded panels,
# comfortable density, cool indigo accent.
[meta]
name = "Glass Dark"
appearance = "dark"
vibrancy = true

[primitive]
gray-50 = "#f5f6fb"
gray-100 = "#e9ebf5"
gray-200 = "#d3d6e8"
gray-300 = "#aeb3cf"
gray-400 = "#858bab"
gray-500 = "#6c7292"
gray-600 = "#4a4f69"
gray-700 = "#363a52"
gray-800 = "#262a3e"
gray-900 = "#181b2b"
gray-950 = "#0f1120"
accent-400 = "#9aa6ff"
accent-500 = "#7c8cff"
accent-600 = "#5f6ff0"
red-400 = "#ff7a88"
amber-400 = "#ffb454"
green-400 = "#5fd49a"
blue-400 = "#6cb6ff"
space-1 = "4px"
space-2 = "8px"
space-3 = "12px"
space-4 = "16px"
radius-1 = "6px"
radius-2 = "12px"
radius-3 = "18px"
font-ui = '-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif'
font-code = 'ui-monospace, "SF Mono", Menlo, monospace'
text-sm = "12px"
text-md = "13.5px"
text-lg = "15px"
duration-fast = "100ms"
duration-normal = "220ms"

[semantic]
surface-0 = "{gray-950}"
surface-1 = "{gray-900}"
surface-2 = "{gray-800}"
surface-overlay = "rgba(30, 33, 54, 0.84)"
surface-glass = "rgba(15, 17, 32, 0.50)"
text = "{gray-100}"
text-muted = "{gray-300}"
text-faint = "{gray-500}"
text-on-accent = "#0b0d1a"
border = "rgba(255, 255, 255, 0.08)"
border-strong = "rgba(255, 255, 255, 0.16)"
focus-ring = "{accent-400}"
accent = "{accent-500}"
accent-hover = "{accent-400}"
accent-muted = "rgba(124, 140, 255, 0.18)"
danger = "{red-400}"
warning = "{amber-400}"
success = "{green-400}"
info = "{blue-400}"
code-bg = "#12152a"
diff-add = "rgba(95, 212, 154, 0.14)"
diff-del = "rgba(255, 122, 136, 0.14)"
diff-add-text = "#7ee2b0"
diff-del-text = "#ff9aa5"
ghost-text = "{gray-500}"
state-running = "{info}"
state-needs-you = "{warning}"
state-failed = "{danger}"
state-ready = "{success}"
space-unit = "{space-1}"
radius = "{radius-2}"
font-ui = "{font-ui}"
font-code = "{font-code}"
text-ui = "{text-md}"
text-code = "12.5px"
motion-fast = "{duration-fast}"
motion-normal = "{duration-normal}"

[component]
panel-gap = "6px"
panel-radius = "{radius}"
glass-blur = "30px"
tab-radius = "10px"
composer-radius = "16px"
syntax-keyword = "#c4a7ff"
syntax-string = "#8be0b4"
syntax-number = "#ffb98a"
syntax-comment = "#6c7292"
syntax-function = "#8fb4ff"
syntax-type = "#7fd8e8"
syntax-variable = "#e9ebf5"
syntax-property = "#a9c0ff"
syntax-punctuation = "#858bab"
