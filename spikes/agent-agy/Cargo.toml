[package]
name = "spike-agent-agy"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atrium-protocol.workspace = true
atrium-agents.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true

# Unique example names: several spike crates have `record`/`chat` examples, and
# cargo writes every example to the shared target/debug/examples/, so same-named
# examples overwrite each other (tests then ran another crate's `record`).
[[example]]
name = "agy-record"
path = "examples/record.rs"

[[example]]
name = "agy-chat"
path = "examples/chat.rs"
