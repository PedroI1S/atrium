<!doctype html>
<meta charset="utf-8">
<title>animation</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="c"></canvas>
<script>
  // Every frame changes (moving shapes + a frame counter), so a screencast frame is
  // produced for every compositor frame.
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  let w = 0, h = 0, n = 0;
  const balls = Array.from({ length: 60 }, (_, i) => ({
    x: Math.random() * 1000, y: Math.random() * 700,
    vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7,
    r: 8 + Math.random() * 26, hue: (i * 37) % 360,
  }));
  // The backing store follows devicePixelRatio, so at 2x the frames really carry 4x the pixels.
  function size() {
    const r = devicePixelRatio || 1;
    c.width = Math.round(innerWidth * r); c.height = Math.round(innerHeight * r);
    g.setTransform(r, 0, 0, r, 0, 0);
    w = innerWidth; h = innerHeight;
  }
  addEventListener('resize', size); size();
  function frame(t) {
    n++;
    g.fillStyle = '#101418'; g.fillRect(0, 0, w, h);
    for (const b of balls) {
      b.x += b.vx; b.y += b.vy;
      if (b.x < b.r || b.x > w - b.r) b.vx *= -1;
      if (b.y < b.r || b.y > h - b.r) b.vy *= -1;
      g.fillStyle = `hsl(${(b.hue + n) % 360} 80% 60%)`;
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, 6.2832); g.fill();
    }
    g.fillStyle = '#fff'; g.font = '28px ui-monospace, Menlo, monospace';
    g.fillText('frame ' + n + '  t=' + (t / 1000).toFixed(2), 20, 44);
    window.__raf = n;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
