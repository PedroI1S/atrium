[package]
name = "spike-daemon-socket"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atrium-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dependencies.rusqlite]
version = "0.40.2"
features = ["bundled"]

[dependencies.nix]
version = "0.31.3"
features = ["user", "signal"]

[dev-dependencies]
tempfile = "3.27"

# ctrl_c is used only by the demonstration client.
[dependencies.tokio]
workspace = true
features = ["signal"]

[dependencies.sysinfo]
version = "0.37.2"
default-features = false
features = ["system"]
