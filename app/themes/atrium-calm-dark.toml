# Atrium Calm, dark. The shipped default (docs/design/ui-direction.md; token contract: docs/contracts/m1.md §11.1).
# Same token names as the light theme. Soft dark greys, never pure black; the accent
# is a light ink. Window opacity is applied at runtime (proposal CR-02).
[meta]
name = "Atrium Calm Dark"
appearance = "dark"
vibrancy = true

[primitive]
# Neutral scale, from the window colour towards the text colour.
gray-0 = "#161615"
gray-25 = "#212120"
gray-50 = "#272725"
gray-100 = "#2f2f2d"
gray-200 = "#3a3a37"
gray-300 = "#4d4d49"
gray-400 = "#73736d"
gray-500 = "#8a8a83"
gray-600 = "#a4a49e"
gray-700 = "#c4c4be"
gray-800 = "#dcdcd7"
gray-900 = "#ecebe6"
gray-950 = "#e9e9e5"
amber-600 = "#e0a35c"
red-600 = "#e8867b"
green-600 = "#80c396"
slate-600 = "#8fa5c3"
space-1 = "4px"
space-2 = "8px"
space-3 = "12px"
space-4 = "16px"
space-6 = "24px"
radius-1 = "7px"
radius-2 = "10px"
radius-3 = "14px"
font-ui = '"Instrument Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif'
font-code = '"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace'
text-sm = "12px"
text-md = "13.5px"
text-lg = "14.5px"
duration-fast = "90ms"
duration-normal = "160ms"

[semantic]
surface-0 = "{gray-0}"           # window frame and sidebar
surface-1 = "{gray-25}"          # cards
surface-2 = "{gray-50}"          # raised inside a card
surface-overlay = "{gray-100}"
surface-glass = "rgba(22, 22, 21, 0.72)"
text = "{gray-950}"
text-muted = "{gray-600}"
text-faint = "{gray-400}"        # decoration only
text-on-accent = "#1b1b1a"
border = "rgba(255, 255, 245, 0.07)"
border-strong = "rgba(255, 255, 245, 0.13)"
focus-ring = "{gray-900}"
accent = "{gray-900}"
accent-hover = "#ffffff"
accent-muted = "rgba(255, 255, 245, 0.085)"
danger = "{red-600}"
warning = "{amber-600}"
success = "{green-600}"
info = "{slate-600}"
code-bg = "rgba(255, 255, 245, 0.05)"
diff-add = "rgba(128, 195, 150, 0.12)"
diff-del = "rgba(232, 134, 123, 0.12)"
diff-add-text = "#9bd5ad"
diff-del-text = "#f0a79e"
ghost-text = "#6c6c66"
state-running = "{info}"
state-needs-you = "{warning}"
state-failed = "{danger}"
state-ready = "{success}"
space-unit = "{space-1}"
radius = "{radius-2}"
font-ui = "{font-ui}"
font-code = "{font-code}"
text-ui = "{text-md}"
text-code = "12.5px"
motion-fast = "{duration-fast}"
motion-normal = "{duration-normal}"

# Overlays that stay correct on a translucent surface, overlay shadow and blur, syntax
# (required semantic tokens, contract §11.1)
hover = "rgba(255, 255, 245, 0.05)"
selected = "rgba(255, 255, 245, 0.085)"
state-needs-you-bg = "rgba(224, 163, 92, 0.13)"
state-failed-bg = "rgba(232, 134, 123, 0.12)"
state-ready-bg = "rgba(128, 195, 150, 0.12)"
state-running-bg = "rgba(143, 165, 195, 0.12)"
shadow-overlay = "0 1px 2px rgba(0, 0, 0, 0.20), 0 6px 18px -10px rgba(0, 0, 0, 0.50)"
scrim = "rgba(0, 0, 0, 0.40)"
glass-blur = "24px"
syntax-keyword = "#bba3dd"
syntax-string = "#9ecba8"
syntax-number = "#d8b47e"
syntax-comment = "#8a8a83"
syntax-function = "#93b5da"
syntax-type = "#d8b47e"
syntax-variable = "{text}"
syntax-property = "#c4c4be"
syntax-punctuation = "{text-muted}"

[component]
sidebar-width = "244px"
panel-width = "420px"
panel-strip-width = "46px"
panel-width-editor = "380px"
advanced-width = "400px"
sidebar-min-width = "200px"
sidebar-max-width = "360px"
panel-min-width = "320px"
panel-max-width = "640px"
card-gap = "8px"
card-radius = "11px"
window-radius = "12px"
chat-measure = "640px"
chat-font-size = "14.5px"
composer-radius = "16px"
bubble-bg = "rgba(255, 255, 245, 0.07)"
shadow-window = "0 0 0 0.5px rgba(255, 255, 255, 0.10), 0 30px 70px -20px rgba(0, 0, 0, 0.65), 0 8px 20px -8px rgba(0, 0, 0, 0.40)"
shadow-card = "0 0 0 0.5px rgba(255, 255, 245, 0.08), 0 1px 3px rgba(0, 0, 0, 0.30)"
