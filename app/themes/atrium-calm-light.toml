# Atrium Calm, light. The shipped default (docs/design/ui-direction.md; token contract: docs/contracts/m1.md §11.1).
# Near-monochrome: greys and an ink accent; colour is reserved for attention states,
# diffs and syntax. Surfaces are opaque here; window opacity is applied at runtime
# from the user's settings, never by the theme.
[meta]
name = "Atrium Calm Light"
appearance = "light"
vibrancy = true

[primitive]
# Neutral scale, from the window colour towards the text colour.
gray-0 = "#ffffff"
gray-25 = "#f7f7f5"
gray-50 = "#eeeeeb"
gray-100 = "#e4e4e0"
gray-200 = "#d6d6d1"
gray-300 = "#bcbcb6"
gray-400 = "#9b9b95"
gray-500 = "#74746e"
gray-600 = "#63635e"
gray-700 = "#4a4a46"
gray-800 = "#3b3b38"
gray-900 = "#262624"
gray-950 = "#1f1f1d"
# Attention states, darkened until they pass AA as text on surface-0..2.
amber-600 = "#94540f"
red-600 = "#ac3c33"
green-600 = "#33704a"
slate-600 = "#4d6684"
space-1 = "4px"
space-2 = "8px"
space-3 = "12px"
space-4 = "16px"
space-6 = "24px"
radius-1 = "7px"
radius-2 = "10px"
radius-3 = "14px"
font-ui = '"Instrument Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif'
font-code = '"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace'
text-sm = "12px"
text-md = "13.5px"
text-lg = "14.5px"
duration-fast = "90ms"
duration-normal = "160ms"

[semantic]
surface-0 = "{gray-50}"          # window frame and sidebar, the part that fades first
surface-1 = "{gray-0}"           # cards: chat, editor, panel
surface-2 = "{gray-25}"          # raised inside a card: diff body, code blocks
surface-overlay = "{gray-0}"
surface-glass = "rgba(238, 238, 235, 0.72)"
text = "{gray-950}"
text-muted = "{gray-600}"
text-faint = "{gray-400}"        # decoration only (line numbers, idle rings); not for text that must be read
text-on-accent = "{gray-0}"
border = "rgba(30, 30, 20, 0.08)"
border-strong = "rgba(30, 30, 20, 0.15)"
focus-ring = "{gray-900}"
accent = "{gray-900}"            # ink: primary buttons, send, toggles
accent-hover = "{gray-800}"
accent-muted = "rgba(30, 30, 20, 0.085)"
danger = "{red-600}"
warning = "{amber-600}"
success = "{green-600}"
info = "{slate-600}"
code-bg = "rgba(30, 30, 20, 0.04)"
diff-add = "rgba(51, 112, 74, 0.10)"
diff-del = "rgba(172, 60, 51, 0.09)"
diff-add-text = "#2d6842"
diff-del-text = "#97372f"
ghost-text = "#a3a39d"
state-running = "{info}"
state-needs-you = "{warning}"
state-failed = "{danger}"
state-ready = "{success}"
space-unit = "{space-1}"
radius = "{radius-2}"
font-ui = "{font-ui}"
font-code = "{font-code}"
text-ui = "{text-md}"
text-code = "12.5px"
motion-fast = "{duration-fast}"
motion-normal = "{duration-normal}"

# Overlays that stay correct on a translucent surface, overlay shadow and blur, syntax
# (required semantic tokens, contract §11.1)
hover = "rgba(30, 30, 20, 0.055)"
selected = "rgba(30, 30, 20, 0.085)"
state-needs-you-bg = "rgba(148, 84, 15, 0.12)"
state-failed-bg = "rgba(172, 60, 51, 0.11)"
state-ready-bg = "rgba(51, 112, 74, 0.11)"
state-running-bg = "rgba(77, 102, 132, 0.11)"
shadow-overlay = "0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 18px -10px rgba(0, 0, 0, 0.14)"
scrim = "rgba(20, 20, 15, 0.18)"
glass-blur = "24px"
syntax-keyword = "#6c4a96"
syntax-string = "#3d7650"
syntax-number = "#87591d"
syntax-comment = "#6e6e68"
syntax-function = "#2d5d8c"
syntax-type = "#87591d"
syntax-variable = "{text}"
syntax-property = "#4a4a46"
syntax-punctuation = "{text-muted}"

[component]
# Layout (layout B, "Floating spaces")
sidebar-width = "244px"
panel-width = "420px"
panel-strip-width = "46px"
panel-width-editor = "380px"
advanced-width = "400px"
sidebar-min-width = "200px"
sidebar-max-width = "360px"
panel-min-width = "320px"
panel-max-width = "640px"
card-gap = "8px"
card-radius = "11px"
window-radius = "12px"
chat-measure = "640px"
chat-font-size = "14.5px"
composer-radius = "16px"
bubble-bg = "rgba(30, 30, 20, 0.055)"
# Shadows and blur (CR-01)
shadow-window = "0 0 0 0.5px rgba(0, 0, 0, 0.16), 0 30px 70px -20px rgba(40, 30, 20, 0.40), 0 8px 20px -8px rgba(40, 30, 20, 0.18)"
shadow-card = "0 0 0 0.5px rgba(30, 30, 20, 0.10), 0 1px 3px rgba(30, 30, 20, 0.06)"
